name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      # Несущая проверка репозитория: клиент ГЕНЕРИРУЕТСЯ, и закоммиченный файл
      # обязан совпадать с тем, что даёт контракт. Ловит и правку руками, и
      # забытую перегенерацию после обновления openapi/v1.json.
      #
      # Сети, кроме прокси модулей, не нужно: генерация идёт из КОММИТНУТОГО
      # контракта, а не из живого API. Сверка с живым — отдельный, осознанный
      # шаг (scripts/sync-contract.sh --check), и в CI её нет намеренно: прод
      # отстаёт от смерженного api, и такой гейт краснел бы по чужой причине.
      - name: клиент соответствует контракту
        # ⚠ Своя версия тулчейна, и это не косметика. setup-go при
        # go-version-file ставит GOTOOLCHAIN=local, а oapi-codegen v2.8.0
        # требует Go >= 1.25 — при go.mod 1.24 шаг падал НЕ на расхождении
        # клиента, а на запуске генератора, и красный он был у всех подряд.
        # Проверять на объявленном минимуме надо БИБЛИОТЕКУ (build/vet/test
        # выше), а генератор — это инструмент, и ему нужен свой тулчейн.
        env:
          GOTOOLCHAIN: auto
        run: ./scripts/generate.sh --check
